[project]
name = "pixie"
version = "0.1.0"
description = "A local-first dashboard for your personal tools and models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Alex Kapadia" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "rich>=13",
  "typer>=0.13",
  "psutil>=6",
  "watchfiles>=1.0",
  "pyyaml>=6",
  "pillow>=11",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "markdown-it-py>=3",
  "pygments>=2.18",
  "soundfile>=0.12",
  "networkx>=3",
  "plotly>=5.24",
]

[project.optional-dependencies]
accuracy = [
  # Heavy comparators for check #12 (reference_fixtures_match).
  # When missing, the affected comparators degrade to size+sha256
  # and tag the diff metric so the report explains the weaker check.
  "scikit-image>=0.24",
  "librosa>=0.10",
  "pdfplumber>=0.11",
  "pillow>=10",
  "numpy>=1.26",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-benchmark>=4",
  "playwright>=1.49",
  "pillow>=10",
  "ruff>=0.7",
]

[project.scripts]
pixie = "pixie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast in-process tests against a single module",
  "integration: tests spanning multiple Pixie modules or running a live server",
  "visual: Playwright pixel-diff visual regression tests",
  "format: round-trip exporter tests (Wave 2 fills these in)",
  "perf: pytest-benchmark perf budgets",
  "a11y: axe-core accessibility audits via Playwright",
  "e2e: end-to-end browser flows against real tools",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=4",
    "playwright>=1.49",
    "pillow>=10",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
