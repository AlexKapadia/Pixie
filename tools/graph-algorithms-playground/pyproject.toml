[project]
name = "graph-algorithms-playground"
version = "0.1.0"
description = "Run classic graph algorithms on a small edge list."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "networkx>=3.3",
  "numpy>=1.26",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_algorithms_playground"]
