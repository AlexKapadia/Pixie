[project]
name = "vit-classifier-gradcam"
version = "0.1.0"
description = "Vision Transformer classifier with Grad-CAM explanation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Install with: uv sync --group models
models = [
    "torch>=2.0,<3",
    "torchvision>=0.18",
    "transformers>=4.40",
    "grad-cam>=1.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
