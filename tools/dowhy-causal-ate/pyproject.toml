[project]
name = "dowhy-causal-ate"
version = "0.1.0"
description = "Causal ATE estimator (regression + IPW)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dowhy_causal_ate"]
