[project]
name = "image-segmentation"
version = "0.1.0"
description = "Foreground / background image segmentation with cut-out and binary mask outputs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Install with: uv sync --group models
models = [
    "rembg>=2.0",
    "onnxruntime>=1.18",
]
