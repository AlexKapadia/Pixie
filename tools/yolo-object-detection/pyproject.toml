[project]
name = "yolo-object-detection"
version = "0.1.0"
description = "YOLOv8 object detection. Falls back to a deterministic stub if ultralytics is not installed."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Real model runtime. Install with: uv sync --group models
# CPU-only torch via the dedicated index; ultralytics pulls torchvision.
models = [
    "torch>=2.0,<3",
    "torchvision>=0.18",
    "ultralytics>=8.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
