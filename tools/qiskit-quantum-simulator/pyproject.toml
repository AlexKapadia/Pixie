[project]
name = "qiskit-quantum-simulator"
version = "0.1.0"
description = "Lightweight numpy quantum circuit simulator (Qiskit substitute)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiskit_quantum_simulator"]
