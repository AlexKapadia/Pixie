[project]
name = "geospatial-kde-heatmap"
version = "0.1.0"
description = "Kernel density estimation on geographic points."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geospatial_kde_heatmap"]
