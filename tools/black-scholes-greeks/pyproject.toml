[project]
name = "black-scholes-greeks"
version = "0.1.0"
description = "Closed-form Black-Scholes pricer with first-order Greeks and a strike-time heatmap."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
