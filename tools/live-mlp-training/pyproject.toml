[project]
name = "live-mlp-training"
version = "0.1.0"
description = "Streaming MLP training tool — loss and accuracy curves render live."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Install the torch runtime with `uv sync --group runtime`. The default
# install ships a pure-numpy fallback so the tool validates without
# torch on the box.
runtime = [
    "torch>=2.0,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
