[project]
name = "backtest-engine"
version = "0.1.0"
description = "Moving-average crossover backtest with per-trade log and risk metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
