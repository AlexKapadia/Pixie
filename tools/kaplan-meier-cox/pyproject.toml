[project]
name = "kaplan-meier-cox"
version = "0.1.0"
description = "Kaplan-Meier survival curves + Cox proportional hazards."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "lifelines>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaplan_meier_cox"]
