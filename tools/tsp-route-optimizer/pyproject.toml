[project]
name = "tsp-route-optimizer"
version = "0.1.0"
description = "Travelling salesman route optimiser."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "ortools>=9.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsp_route_optimizer"]
