[project]
name = "time-series-forecast"
version = "0.1.0"
description = "Univariate ARIMA / SARIMA / Holt-Winters forecast with backtested error metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Optional: Facebook Prophet. Add via `uv sync --group prophet`. Not
# enabled by default because the wheel is heavy and brittle on Windows.
prophet = [
    "prophet>=1.1.5",
]
