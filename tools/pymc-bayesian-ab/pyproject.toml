[project]
name = "pymc-bayesian-ab"
version = "0.1.0"
description = "Beta-Binomial Bayesian A/B test."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_bayesian_ab"]
