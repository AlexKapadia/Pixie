{# Fragment used by both the full /tools page and the htmx filter refresh. #}
{% if grid.cards %}
  {% for card in grid.cards %}
    {% include "partials/tool_grid_card.html" %}
  {% endfor %}
{% else %}
  <div class="tools-grid__empty">
    <div class="t-h5">No tools match the current filters.</div>
    <p class="t-meta">Adjust the filters on the left, or
      <a href="/tools" hx-get="/tools" hx-target="#pixie-main-content" hx-push-url="true">clear all filters</a>.
    </p>
  </div>
{% endif %}
