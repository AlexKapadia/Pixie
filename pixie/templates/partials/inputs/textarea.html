{%- from "_macros.html" import field_open, field_close -%}
{{ field_open(spec, field_id) }}
<div class="field__control">
  <textarea class="textarea{% if spec.monospace %} mono{% endif %}"
            id="{{ field_id }}"
            name="{{ spec.key }}"
            rows="4"
            x-model="values[{{ spec.key | tojson }}]"
            {% if spec.placeholder %}placeholder="{{ spec.placeholder }}"{% endif %}
            {% if spec.max_length %}maxlength="{{ spec.max_length }}"{% endif %}
            {% if spec.required %}required aria-required="true"{% endif %}
            spellcheck="false">{% if value is not none %}{{ value }}{% endif %}</textarea>
</div>
{{ field_close(spec) }}
