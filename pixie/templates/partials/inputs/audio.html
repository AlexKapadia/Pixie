{%- from "_macros.html" import field_open, field_close -%}
{{ field_open(spec, field_id) }}
<div class="field__control audio-input"
     x-data='Pixie.audioInput()'
     :class="{ "is-dragover": dragover, "is-filled": !!file }"
     @dragover.prevent="dragover = true"
     @dragleave.prevent="dragover = false"
     @drop.prevent="onDrop($event)">
  <input type="file"
         class="sr-only"
         id="{{ field_id }}"
         name="{{ spec.key }}"
         accept="audio/*"
         {% if spec.required %}required aria-required="true"{% endif %}
         @change="onChange($event)" />
  <template x-if="!file">
    <label for="{{ field_id }}" class="file-drop file-drop--empty">
      <span class="file-drop__icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6v4M5 4v8M8 2v12M11 4v8M14 6v4"/></svg>
      </span>
      <span class="file-drop__copy">
        <span class="file-drop__primary">Drop audio or <span class="file-drop__browse">browse</span></span>
        <span class="file-drop__hint t-meta">MP3, WAV, FLAC, M4A, OGG{% if spec.max_size_mb %} · max {{ spec.max_size_mb }} MB{% endif %}</span>
      </span>
    </label>
  </template>
  <template x-if="file">
    <div class="audio-input__row panel">
      <button type="button" class="btn btn--icon audio-input__play"
              @click.prevent="togglePlay()"
              :aria-label="playing ? 'Pause' : 'Play'">
        <template x-if="!playing">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 3 12 8 4 13 z"/></svg>
        </template>
        <template x-if="playing">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3" width="3" height="10"/><rect x="9.5" y="3" width="3" height="10"/></svg>
        </template>
      </button>
      <div class="audio-input__meta">
        <div class="audio-input__head">
          <span class="audio-input__name" x-text="file.name"></span>
          <span class="audio-input__duration t-meta mono" x-text="durationText"></span>
        </div>
        <svg class="audio-input__wave" viewBox="0 0 400 28" width="100%" height="28" preserveAspectRatio="none" aria-hidden="true">
          <template x-for="(bar, i) in bars" :key="i">
            <rect :x="i * 5.8" :y="14 - bar / 2" width="3" :height="bar" rx="1" :fill="(i / bars.length) < progress ? 'var(--accent)' : 'var(--border-strong)'"></rect>
          </template>
        </svg>
      </div>
      <button type="button" class="btn btn--ghost btn--icon btn--sm" @click.prevent="reset()" aria-label="Remove">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </template>
</div>
{{ field_close(spec) }}
