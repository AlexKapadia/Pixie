{%- from "_macros.html" import field_open, field_close -%}
{%- set cols_json = spec.columns | dump_pydantic | tojson -%}
{{ field_open(spec, field_id) }}
<div class="field__control table-input"
     x-data='{
       cols: {{ cols_json }},
       rows: (Array.isArray({{ initial_json }}) ? {{ initial_json }} : []),
       blankRow() { const r = {}; this.cols.forEach(c => r[c.key] = c.type === "number" ? 0 : ""); return r; },
       add() { this.rows.push(this.blankRow()); this.sync(); },
       remove(i) {
         {% if spec.min_rows %}if (this.rows.length <= {{ spec.min_rows }}) return;{% endif %}
         this.rows.splice(i, 1); this.sync();
       },
       sync() { values[{{ spec.key | tojson }}] = JSON.parse(JSON.stringify(this.rows)); }
     }'
     x-init='if (!rows.length){% if spec.min_rows %} for (let i = 0; i < {{ spec.min_rows }}; i++) add();{% else %} add();{% endif %} sync();'>
  <div class="table-input__grid" role="grid" :id="{{ field_id | tojson }}">
    <div class="table-input__head" role="row"
         :style="`grid-template-columns: repeat(${cols.length}, minmax(0, 1fr)) 28px`">
      <template x-for="(c, i) in cols" :key="i">
        <div class="table-input__head-cell" role="columnheader">
          <span x-text="c.label"></span>
          <span class="badge" style="height:14px; padding:0 4px; font-size:9px;" x-text="c.type"></span>
        </div>
      </template>
      <div class="table-input__head-cell"></div>
    </div>
    <template x-for="(row, ri) in rows" :key="ri">
      <div class="table-input__row" role="row"
           :style="`grid-template-columns: repeat(${cols.length}, minmax(0, 1fr)) 28px`">
        <template x-for="(c, ci) in cols" :key="ci">
          <div class="table-input__cell" role="gridcell">
            <input class="table-input__entry mono"
                   :type="c.type === 'number' ? 'number' : (c.type === 'date' ? 'date' : 'text')"
                   :value="row[c.key] ?? ''"
                   @input="row[c.key] = (c.type === 'number' ? Number($event.target.value) : $event.target.value); sync()"
                   :aria-label="c.label" />
          </div>
        </template>
        <div class="table-input__cell table-input__cell--actions">
          <button type="button" class="btn btn--ghost btn--icon btn--sm"
                  @click.prevent="remove(ri)" aria-label="Remove row">
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </button>
        </div>
      </div>
    </template>
    <button type="button" class="table-input__add" @click.prevent="add()"
            {% if spec.max_rows %}:disabled="rows.length >= {{ spec.max_rows }}"{% endif %}>
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      Add row
    </button>
  </div>
  <input type="hidden" name="{{ spec.key }}"
         data-json-type="json"
         :value="JSON.stringify(rows)" />
</div>
{{ field_close(spec) }}
