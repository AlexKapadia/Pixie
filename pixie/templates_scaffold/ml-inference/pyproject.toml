[project]
name = "{{TOOL_ID}}"
version = "0.1.0"
description = "{{DESCRIPTION}}"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Install with `uv sync --group models` once the download script has run.
# Torch is intentionally excluded from the default install so the tool
# stays light until the author commits to the model.
models = [
    "torch>=2.0,<3",
]
