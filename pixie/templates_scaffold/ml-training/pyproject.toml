[project]
name = "{{TOOL_ID}}"
version = "0.1.0"
description = "{{DESCRIPTION}}"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
# Real training runtime; install on demand:
#   uv sync --group runtime
runtime = [
    "torch>=2.0,<3",
]
